<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>sakukatu46</title>

    <style>
      :root {
        color-scheme: light;
        --background: #f8f7f3;
        --text: #34352f;
        --muted: #87847c;
        --line: #dedbd3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Arial, "Noto Sans JP", sans-serif;
        line-height: 1.7;
      }

      a {
        color: inherit;
      }

      header {
        max-width: 1120px;
        margin: auto;
        padding: 25px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: .15em;
      }

      .back {
        padding: 8px 0;
        color: var(--muted);
        font-size: 12px;
        text-decoration: none;
      }

      main {
        max-width: 960px;
        margin: 100px auto;
        padding: 0 28px;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .feature {
        position: relative;
        min-height: 280px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 48px;
        border: 1px solid var(--line);
        text-decoration: none;
        transition:
          background .2s,
          border-color .2s,
          transform .2s;
      }

      .feature:hover {
        background: #f0ede6;
        border-color: #aaa396;
        transform: translateY(-3px);
      }

      .feature:focus-visible,
      .back:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 5px;
      }

      .feature-icon {
        width: 42px;
        height: 42px;
        color: #8a7966;
      }

      .feature-bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }

      .feature h2 {
        margin: 0 0 12px;
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: .14em;
      }

      .feature p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.9;
      }

      .arrow {
        padding-bottom: 4px;
        font-size: 22px;
      }

      @media (max-width: 640px) {
        header {
          padding: 20px;
        }

        main {
          margin: 60px auto;
          padding: 0 20px;
        }

        .features {
          grid-template-columns: 1fr;
          gap: 18px;
        }

        .feature {
          min-height: 240px;
          padding: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .feature {
          transition: none;
        }

        .feature:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>sakukatu46</h1>
      <a class="back" href="index.html">戻る</a>
    </header>

    <main>
      <nav class="features" aria-label="機能を選ぶ">
        <a class="feature" href="sakuratabi.html">
          <svg
            class="feature-icon"
            viewBox="0 0 48 48"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            aria-hidden="true"
          >
            <circle cx="24" cy="24" r="18"></circle>
            <path d="M30 18 27 27 18 30 21 21Z"></path>
            <path d="M24 3V8M24 40V45M3 24H8M40 24H45"></path>
          </svg>

          <div class="feature-bottom">
            <div>
              <h2>櫻旅</h2>
              <p>旅の写真と思い出を、日本地図に。</p>
            </div>

            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </a>

        <!-- 今後の機能は、ここにリンクを追加します。 -->
      </nav>
    </main>
  </body>
</html>
